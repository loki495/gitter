volumes:
  mysql-data: {}

services:
  app:
    container_name: git-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./storage/ssh:/var/www/html/storage/ssh:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.git.rule=Host(`git.dev.local.test`)"
      - "traefik.http.routers.git.entrypoints=web"
      - "traefik.http.services.git.loadbalancer.server.port=80"
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.4-apache
        COPY docker/setup-dev-container.sh /tmp/setup.sh
        RUN chmod +x /tmp/setup.sh && /usr/bin/bash /tmp/setup.sh
    command: >
      sh -c "
        exec apache2-foreground
      "
    networks:
      - web

  vite:
    image: node:18
    container_name: git-vite
    working_dir: /var/www/html
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.git-vite.rule=Host(`vite.git.dev.local.test`)"
      - "traefik.http.routers.git-vite.entrypoints=web"
      - "traefik.http.services.git-vite.loadbalancer.server.port=5173"
    networks:
      - web

networks:
  web:
    external: true
